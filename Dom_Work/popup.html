<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sahayak</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <div class="logo">🧠</div>
        <div>
          <div class="title">Sahayak</div>
          <div class="subtitle">AI Web Adapter</div>
        </div>
      </div>
      <div id="status-dot" class="status-dot" title="Status"></div>
    </header>

    <button id="extract-btn" class="btn primary">Extract Page Data</button>
    <button id="send-ai-btn" class="btn secondary hidden">Send to AI Module →</button>

    <div id="results" class="hidden">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="stat-buttons">0</div><div class="stat-label">Buttons</div></div>
        <div class="stat"><div class="stat-num" id="stat-inputs">0</div><div class="stat-label">Inputs</div></div>
        <div class="stat"><div class="stat-num" id="stat-forms">0</div><div class="stat-label">Forms</div></div>
      </div>

      <div class="panel">
        <div class="panel-header"><span>Title</span></div>
        <div class="panel-body"><span id="title-text" class="title-text"></span></div>
      </div>

      <div class="panel">
        <div class="panel-header"><span>Headings</span><span id="hdg-count">0</span></div>
        <div class="panel-body" id="headings-body"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><span>Buttons</span><span id="btn-count">0</span></div>
        <div class="panel-body" id="buttons-body"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><span>Inputs</span><span id="inp-count">0</span></div>
        <div class="panel-body" id="inputs-body"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><span>Visible Text</span></div>
        <div class="panel-body"><div id="text-preview" class="text-preview"></div></div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
