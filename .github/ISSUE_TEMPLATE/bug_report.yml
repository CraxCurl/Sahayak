name: Bug Report
description: Create a report to help us fix a bug in Sahayak
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      options:
        - Developer 1: Extension Shell (src/extension)
        - Developer 2: DOM & Adaptive Engine (src/dom)
        - Developer 3: AI & Ollama (src/ai)
        - Developer 4: Forms & Preferences (src/forms)
        - Shared Infrastructure (src/shared)
    validations:
      required: true
  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Chrome and navigate to '...'
        2. Click on '...'
        3. See error in console
    validations:
      required: true
